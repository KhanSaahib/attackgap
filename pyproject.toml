[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attackgap"
version = "0.1.0"
description = "Offline MITRE ATT&CK detection-coverage gap mapper for Sigma rules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KhanSaahib" }]
dependencies = []
keywords = ["mitre-attack", "sigma", "detection-engineering", "security", "coverage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/KhanSaahib/attackgap"
Issues = "https://github.com/KhanSaahib/attackgap/issues"
Source = "https://github.com/KhanSaahib/attackgap"

[project.scripts]
attackgap = "attackgap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["attackgap*"]
