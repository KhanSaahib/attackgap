[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attackgap"
version = "0.1.0"
description = "Offline MITRE ATT&CK detection-coverage gap mapper for Sigma rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KhanSaahib" }]
dependencies = []

[project.scripts]
attackgap = "attackgap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["attackgap*"]
